<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GS Baseball Tryouts</title>
<meta name="theme-color" content="#0B2753">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Graduate&display=swap" rel="stylesheet">
<style>
  :root{--ground:#E8ECF2;--surface:#FFFFFF;--surface-2:#F2F5F9;--ink:#0B1C3D;--ink-2:#4A5874;--line:#D4DBE6;
    --navy:#0B2753;--navy-2:#12336A;--carolina:#6DA0D6;--accent:#245FA8;--accent-soft:#DCE8F6;--bad:#C3392D;--cut:10px;
    --display:"Graduate","Rockwell","Roboto Slab",Georgia,serif;--body:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif}
  *{box-sizing:border-box}
  html{background:var(--navy)}
  body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.45 var(--body);padding:0 0 48px;min-height:100vh}
  header{background:var(--navy);color:#fff;text-align:center;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 34px;margin-bottom:-14px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px));border-bottom:4px solid var(--carolina)}
  header img{width:118px;height:auto;display:block;margin:0 auto 12px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
  .badge{display:inline-block;background:var(--carolina);color:var(--navy);font:15px var(--display);letter-spacing:.08em;padding:5px 14px;text-transform:uppercase;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  h1{font:clamp(30px,8.5vw,46px)/1.05 var(--display);text-transform:uppercase;margin:14px 0 10px;letter-spacing:.01em}
  h1 span{color:var(--carolina)}
  header p{color:#C9D6EA;margin:0 auto;max-width:440px}
  form{max-width:640px;margin:0 auto;padding:30px 16px 0}
  fieldset{border:1px solid var(--line);background:var(--surface);padding:30px 16px 6px;margin:0 0 18px;position:relative;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));box-shadow:0 1px 0 rgba(11,28,61,.04)}
  legend{position:absolute;top:0;left:0;background:var(--navy);color:#fff;font:14px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:5px 14px 5px 18px;
    clip-path:polygon(var(--cut) 0,100% 0,calc(100% - 10px) 100%,0 100%,0 var(--cut))}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  label{display:block;font-size:15px;font-weight:700;margin-bottom:14px;color:var(--ink)}
  label small{font-weight:500;color:var(--ink-2)}
  input,select,textarea{width:100%;margin-top:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:12px;font:17px var(--body);-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent;background-color:#fff}
  textarea{min-height:84px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
  .chips label{margin:0;font-weight:600}
  .chips input{display:none}
  .chips span{display:inline-block;min-width:48px;text-align:center;padding:8px 12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:15px;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
  .chips input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
  .check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
  .check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent);-webkit-appearance:checkbox;appearance:auto}
  button{width:100%;background:var(--accent);color:#fff;border:0;padding:17px;font:20px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  button:active{background:var(--navy)}
  button:disabled{opacity:.6}
  .msg{max-width:640px;margin:14px auto 0;padding:0 16px;text-align:center;color:var(--bad);font-weight:600;min-height:1.5em}
  .done{display:none;max-width:560px;margin:44px auto;text-align:center;background:var(--surface);border-top:4px solid var(--carolina);padding:34px 20px;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .done h2{font:30px var(--display);text-transform:uppercase;color:var(--navy);margin:0 0 8px}
  .done .ball{font-size:40px;margin-bottom:6px}
  footer{text-align:center;color:var(--ink-2);font-size:14px;margin-top:22px}
  .hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<header>
  <img src="img/gs-logo.png" alt="GS">
  <div class="badge" id="season">Tryouts</div>
  <h1><span id="team">GS Baseball</span><br>Tryout Registration</h1>
  <p>Fill this out once per player. We'll reach out with details before tryouts.</p>
</header>

<form id="f" novalidate>
  <fieldset>
    <legend>Player</legend>
    <div class="row">
      <label>First name<input name="playerFirst" required autocomplete="off"></label>
      <label>Last name<input name="playerLast" required autocomplete="off"></label>
    </div>
    <div class="row">
      <label>Date of birth<input name="dob" type="date" required></label>
      <label>Age group<select name="ageGroup" id="ageGroup" required><option value="">Select…</option></select></label>
    </div>
    <div class="row">
      <label>Bats<select name="bats" required><option value="">Select…</option><option>Right</option><option>Left</option><option>Switch</option></select></label>
      <label>Throws<select name="throws" required><option value="">Select…</option><option>Right</option><option>Left</option></select></label>
    </div>
    <label>Positions <small>(pick all that apply)</small></label>
    <div class="chips" id="positions"></div>
    <div class="row">
      <label>Current / last team <small>(optional)</small><input name="currentTeam"></label>
      <label>Years playing<select name="experience"><option value="">Select…</option><option>First year</option><option>1–2 years</option><option>3–4 years</option><option>5+ years</option></select></label>
    </div>
    <label>Jersey size<select name="jerseySize"><option value="">Select…</option><option>YS</option><option>YM</option><option>YL</option><option>YXL</option><option>AS</option><option>AM</option><option>AL</option><option>AXL</option></select></label>
  </fieldset>

  <fieldset>
    <legend>Parent / Guardian</legend>
    <label>Full name<input name="parentName" required autocomplete="name"></label>
    <div class="row">
      <label>Phone<input name="phone" type="tel" required autocomplete="tel"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
    </div>
    <label>City / town<input name="city" autocomplete="address-level2"></label>
  </fieldset>

  <fieldset>
    <legend>Tryout</legend>
    <label>Which session?<select name="session" id="session" required><option value="">Select…</option></select></label>
    <label>Anything coaches should know? <small>(injuries, allergies, conflicts)</small><textarea name="notes"></textarea></label>
    <label>How did you hear about us?<select name="source"><option value="">Select…</option><option>Friend / teammate</option><option>Facebook</option><option>Instagram</option><option>Flyer</option><option>Other</option></select></label>
    <label class="check"><input type="checkbox" name="waiver" required> <span>I'm the parent/guardian and give permission for my player to participate in tryouts. I understand baseball involves risk of injury.</span></label>
    <input class="hp" name="website" tabindex="-1" autocomplete="off">
  </fieldset>

  <button id="btn" type="submit">Submit Registration</button>
  <div class="msg" id="msg"></div>
</form>

<div class="done" id="done">
  <div class="ball">⚾</div>
  <h2>You're registered!</h2>
  <p id="doneText">See you at tryouts.</p>
</div>

<footer>GS Baseball · Spring 2027</footer>

<script src="config.js"></script>
<script>
(function(){
const C = window.TRYOUT_CONFIG || {}, $ = s => document.querySelector(s);
$('#team').textContent = C.TEAM_NAME || 'GS Baseball';
$('#season').textContent = (C.SEASON || '') + ' Tryouts';
document.title = (C.TEAM_NAME || 'GS Baseball') + ' Tryouts';
(C.AGE_GROUPS||[]).forEach(a => $('#ageGroup').add(new Option(a,a)));
(C.SESSIONS||[]).forEach(s => $('#session').add(new Option(s,s)));
if ((C.SESSIONS||[]).length === 1) $('#session').value = C.SESSIONS[0];
['P','C','1B','2B','SS','3B','LF','CF','RF','Utility'].forEach(p=>{
  $('#positions').insertAdjacentHTML('beforeend',`<label><input type="checkbox" name="positions" value="${p}"><span>${p}</span></label>`);
});

})();
</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { getFirestore, doc, setDoc, updateDoc, addDoc, collection, serverTimestamp, increment } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const C = window.TRYOUT_CONFIG || {};
const $ = s => document.querySelector(s);

const app = initializeApp(C.FIREBASE);
const auth = getAuth(app), db = getFirestore(app);
const ready = signInAnonymously(auth).then(c => c.user.uid);

// Count this visit: one record per browser, n = times opened.
const qs = new URLSearchParams(location.search);
const ua = navigator.userAgent;
const device = /iPhone|iPad/i.test(ua) ? 'iPhone/iPad' : /Android/i.test(ua) ? 'Android' : /Mac/i.test(ua) ? 'Mac' : /Windows/i.test(ua) ? 'Windows' : 'Other';
ready.then(async uid => {
  const ref = doc(db, 'tryoutFormVisits', uid);
  try { await updateDoc(ref, { last: serverTimestamp(), n: increment(1) }); }
  catch (e) {
    try { await setDoc(ref, { uid, first: serverTimestamp(), last: serverTimestamp(), n: 1,
      ref: (document.referrer || '').slice(0, 200), src: (qs.get('src') || qs.get('utm_source') || '').slice(0, 40), device }); } catch (_) {}
  }
}).catch(() => {});

const cut = (v, n) => String(v || '').trim().slice(0, n);
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, msg = $('#msg'), btn = $('#btn');
  msg.textContent = '';
  if (!f.checkValidity()) { const bad = f.querySelector(':invalid'); msg.textContent = 'Please fill in: ' + (bad.closest('label')?.childNodes[0].textContent.trim() || 'required fields'); bad.focus(); return; }
  const fd = new FormData(f);
  if (fd.get('website')) return; // bot trap
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const uid = await ready;
    const data = {
      uid, at: serverTimestamp(), seen: false,
      playerFirst: cut(fd.get('playerFirst'), 40), playerLast: cut(fd.get('playerLast'), 40),
      dob: cut(fd.get('dob'), 10), ageGroup: cut(fd.get('ageGroup'), 10),
      bats: cut(fd.get('bats'), 10), throws: cut(fd.get('throws'), 10),
      positions: cut(fd.getAll('positions').join(', '), 120), currentTeam: cut(fd.get('currentTeam'), 80),
      experience: cut(fd.get('experience'), 30), jerseySize: cut(fd.get('jerseySize'), 10),
      parentName: cut(fd.get('parentName'), 80), phone: cut(fd.get('phone'), 30), email: cut(fd.get('email'), 120),
      city: cut(fd.get('city'), 60), session: cut(fd.get('session'), 120), notes: cut(fd.get('notes'), 1000),
      source: cut(fd.get('source'), 40), waiver: !!fd.get('waiver')
    };
    await addDoc(collection(db, 'tryoutSignups'), data);
    f.style.display = 'none';
    $('#doneText').textContent = `${data.playerFirst} is signed up for ${data.session}. We'll text or email ${data.parentName.split(' ')[0]} with details.`;
    $('#done').style.display = 'block'; window.scrollTo(0, 0);
  } catch (err) {
    console.error(err);
    msg.textContent = 'Something went wrong — please try again.';
    btn.disabled = false; btn.textContent = 'Submit Registration';
  }
});
</script>
</body>
</html>
